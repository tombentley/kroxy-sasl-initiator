name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Maven verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run the build
        run: mvn -B -ntp verify
