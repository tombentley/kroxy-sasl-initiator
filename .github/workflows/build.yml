name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Maven verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run the build
        run: mvn -B -ntp -Pci,spotbugs verify

  integration-docker:
    name: Docker integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Show Docker version
        run: docker version

      - name: Run OAUTHBEARER integration tests
        run: >-
          mvn -B -ntp -Pci,spotbugs
          -DskipUTs=true
          -Dfailsafe.excludedGroups=
          -Dfailsafe.failIfNoSpecifiedTests=false
          -Dit.test=SaslOauthBearerInitiationIT
          -pl kroxylicious-sasl-initiation-integration-tests -am
          verify
