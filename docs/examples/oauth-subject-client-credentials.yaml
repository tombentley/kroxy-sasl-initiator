# Per-client OAuth client credentials. The downstream client is terminated with
# SCRAM; the selected subject names the KeyStore entry whose clientId/clientSecret
# obtain a token from the IdP. The token subject must match expectedSubject.
filterDefinitions:
  - name: sasl-termination
    type: SaslTermination
    config:
      mechanisms:
        - mechanism: SCRAM-SHA-256
          credentialStore: io.kroxylicious.scram.credentialstore.file.ScramCredentialFileService
          credentialStoreConfig:
            file: /etc/kroxylicious/termination-credentials.p12
            filePassword:
              passwordFile: /etc/kroxylicious/termination-credentials.p12.password

  - name: sasl-initiation
    type: SaslInitiation
    config:
      mechanism: OAUTHBEARER
      identity:
        mode: subject
      keyStore:
        file: /etc/kroxylicious/sasl-initiation.p12
        filePassword:
          passwordFile: /etc/kroxylicious/sasl-initiation.p12.password
      oauthBearer:
        tokenEndpointUrl: https://idp.example.com/oauth2/token
        scope: kafka
        subjectClaimName: sub

clusterDefinitions:
  - name: kafka
    bootstrapServers: kafka.example.com:9093
    tls:
      trust:
        storeFile: /etc/kroxylicious/kafka.truststore.p12
        storePassword:
          passwordFile: /etc/kroxylicious/kafka.truststore.password

virtualClusters:
  - name: demo
    target:
      cluster: kafka
    filters:
      - sasl-termination
      - sasl-initiation
    gateways:
      - name: default
        portIdentifiesNode:
          bootstrapAddress: localhost:9192
