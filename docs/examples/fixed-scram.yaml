# Fixed/shared identity, SCRAM-SHA-256 to the broker, TLS to the broker.
filterDefinitions:
  - name: sasl-initiation
    type: SaslInitiation
    config:
      mechanism: SCRAM-SHA-256
      identity:
        mode: fixed
        key: proxy-service
      keyStore:
        file: /etc/kroxylicious/sasl-initiation.p12
        filePassword:
          passwordFile: /etc/kroxylicious/sasl-initiation.p12.password
      reauth:
        windowFactor: 0.8

clusterDefinitions:
  - name: kafka
    bootstrapServers: kafka.example.com:9093
    tls:
      trust:
        storeFile: /etc/kroxylicious/kafka.truststore.p12
        storePassword:
          passwordFile: /etc/kroxylicious/kafka.truststore.password

virtualClusters:
  - name: demo
    target:
      cluster: kafka
    filters:
      - sasl-initiation
    gateways:
      - name: default
        portIdentifiesNode:
          bootstrapAddress: localhost:9192
